<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('Editar stock')}"></head>

<body>
  <th:block th:replace="~{fragments/layout :: navegacion}"></th:block>

  <main id="content" class="content py-10">
    <div class="container-fluid">
      <div class="row">
        <div class="col-12">
          <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center mb-4 gap-3">
            <div>
              <h1 class="fs-3 mb-1">Editar stock</h1>
              <p class="mb-0" th:text="${stock.productoNombre}"></p>
            </div>
            <div>
              <a th:href="@{/stock}" class="btn btn-primary">Volver al stock</a>
            </div>
          </div>
        </div>
      </div>

      <div th:replace="~{fragments/layout :: alertas}"></div>

      <div class="card">
        <div class="card-body p-4">
          <form th:action="@{/stock/{id}(id=${stock.productoId})}" th:object="${stock}" method="post">
            <div class="row">
              <div class="col-md-6 mb-3">
                <label for="cantidad" class="form-label">Cantidad en stock *</label>
                <input type="number" class="form-control" id="cantidad" th:field="*{cantidad}" min="0">
              </div>
              <div class="col-md-6 mb-3">
                <label for="stockMaximo" class="form-label">Stock máximo *</label>
                <input type="number" class="form-control" id="stockMaximo" th:field="*{stockMaximo}" min="0">
              </div>
            </div>
            <div class="d-flex gap-2">
              <button type="submit" class="btn btn-primary">Guardar</button>
              <a th:href="@{/stock}" class="btn btn-secondary">Cancelar</a>
            </div>
          </form>
        </div>
      </div>

      <div th:replace="~{fragments/layout :: pie}"></div>
    </div>
  </main>

  <th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>

</html>
