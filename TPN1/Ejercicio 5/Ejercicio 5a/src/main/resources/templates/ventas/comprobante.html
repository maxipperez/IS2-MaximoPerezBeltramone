<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('Comprobante de venta')}"></head>

<body>
  <th:block th:replace="~{fragments/layout :: navegacion}"></th:block>

  <main id="content" class="content py-10">
    <div class="container-fluid">
      <div class="row">
        <div class="col-12">
          <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center mb-4 gap-3">
            <div>
              <h1 class="fs-3 mb-1" th:text="|Comprobante de venta N° ${venta.nroFactura}|"></h1>
              <p class="mb-0" th:text="${#temporals.format(venta.fecha, 'dd/MM/yyyy')}"></p>
            </div>
            <div class="d-flex gap-2">
              <button type="button" class="btn btn-outline-secondary" onclick="window.print()"><i class="ti ti-printer"></i> Imprimir</button>
              <form th:if="${venta.emitida and usuarioSesion.administrador}" th:action="@{/ventas/{id}/anular(id=${venta.id})}" method="post"
                onsubmit="return confirm('Al anular se repone el stock vendido. ¿Continuar?');">
                <button class="btn btn-outline-danger"><i class="ti ti-ban"></i> Anular</button>
              </form>
              <a th:href="@{/ventas}" class="btn btn-primary">Volver</a>
            </div>
          </div>
        </div>
      </div>

      <div th:replace="~{fragments/layout :: alertas}"></div>

      <div class="card">
        <div class="card-body p-4">
          <div class="d-flex justify-content-between flex-wrap gap-3 mb-4">
            <div>
              <span class="d-inline-flex align-items-center"><img th:src="@{/assets/images/logo-icon.svg}" alt="" width="28">
                <span class="ms-2 fs-5 fw-semibold">TechSales Enterprise</span></span>
            </div>
            <div class="text-end">
              <div class="small text-secondary">Cliente</div>
              <div class="fw-semibold" th:text="${venta.clienteNombre}"></div>
              <div class="small" th:text="|DNI ${venta.clienteDni}|"></div>
              <span class="badge mt-1" th:classappend="${venta.emitida} ? 'bg-success-subtle text-success' : 'bg-danger-subtle text-danger'" th:text="${venta.estado}"></span>
            </div>
          </div>

          <div class="table-responsive">
            <table class="table mb-0 text-nowrap">
              <thead class="table-light border-light">
                <tr>
                  <th>Producto</th>
                  <th>Cantidad</th>
                  <th>Precio unitario</th>
                  <th>Subtotal</th>
                </tr>
              </thead>
              <tbody>
                <tr th:each="d : ${venta.items}">
                  <td th:text="${d.productoNombre}"></td>
                  <td th:text="${d.cantidad}"></td>
                  <td th:text="${'$' + #numbers.formatDecimal(d.precioUnitario, 1, 'POINT', 2, 'COMMA')}"></td>
                  <td th:text="${'$' + #numbers.formatDecimal(d.subtotal, 1, 'POINT', 2, 'COMMA')}"></td>
                </tr>
              </tbody>
              <tfoot>
                <tr>
                  <td colspan="3" class="text-end fw-semibold border-bottom-0">Total</td>
                  <td class="fw-semibold fs-5 border-bottom-0" th:text="${'$' + #numbers.formatDecimal(venta.total, 1, 'POINT', 2, 'COMMA')}"></td>
                </tr>
              </tfoot>
            </table>
          </div>
        </div>
      </div>

      <div th:replace="~{fragments/layout :: pie}"></div>
    </div>
  </main>

  <th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>

</html>
