<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('Usuarios')}"></head>

<body>
  <th:block th:replace="~{fragments/layout :: navegacion}"></th:block>

  <main id="content" class="content py-10">
    <div class="container-fluid">
      <div class="row">
        <div class="col-12">
          <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
              <h1 class="fs-3 mb-1">Usuarios</h1>
              <p class="mb-0">Personas que acceden al sistema con usuario y contraseña</p>
            </div>
            <div>
              <a th:href="@{/usuarios/nuevo}" class="btn btn-primary"><i class="ti ti-plus"></i> Nuevo usuario</a>
            </div>
          </div>
        </div>
      </div>

      <div th:replace="~{fragments/layout :: alertas}"></div>

      <div class="card table-responsive">
        <table class="table mb-0 text-nowrap table-hover">
          <thead class="table-light border-light">
            <tr>
              <th>Apellido y nombre</th>
              <th>Correo (usuario)</th>
              <th>Rol</th>
              <th>Alta</th>
              <th>Estado</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody>
            <tr class="align-middle" th:each="u : ${usuarios}">
              <td class="fw-semibold" th:text="|${u.apellido}, ${u.nombre}|"></td>
              <td th:text="${u.mail}"></td>
              <td><span class="badge bg-primary-subtle text-primary" th:text="${u.rol}"></span></td>
              <td th:text="${#temporals.format(u.alta, 'dd/MM/yyyy')}"></td>
              <td>
                <span th:if="${u.activo}" class="badge bg-success-subtle text-success">Activo</span>
                <span th:unless="${u.activo}" class="badge bg-danger-subtle text-danger">Baja</span>
              </td>
              <td>
                <a th:href="@{/usuarios/{id}/editar(id=${u.id})}" title="Editar"><i class="ti ti-edit"></i></a>
                <form th:if="${u.activo and u.id != usuarioSesion.id}" class="d-inline" th:action="@{/usuarios/{id}/eliminar(id=${u.id})}" method="post"
                  onsubmit="return confirm('¿Dar de baja al usuario?');">
                  <button class="btn btn-link link-danger p-0 ms-2" title="Dar de baja"><i class="ti ti-trash"></i></button>
                </form>
              </td>
            </tr>
          </tbody>
        </table>
      </div>

      <div th:replace="~{fragments/layout :: pie}"></div>
    </div>
  </main>

  <th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>

</html>
