<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('Usuario')}"></head>

<body>
  <th:block th:replace="~{fragments/layout :: navegacion}"></th:block>

  <main id="content" class="content py-10">
    <div class="container-fluid">
      <div class="row">
        <div class="col-12">
          <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center mb-4 gap-3">
            <div>
              <h1 class="fs-3 mb-1" th:text="${usuario.id == null ? 'Nuevo usuario' : 'Editar usuario'}"></h1>
              <p class="mb-0">El correo personal se utiliza como usuario del sistema</p>
            </div>
            <div>
              <a th:href="@{/usuarios}" class="btn btn-primary">Volver al listado</a>
            </div>
          </div>
        </div>
      </div>

      <div th:replace="~{fragments/layout :: alertas}"></div>

      <div class="card">
        <div class="card-body p-4">
          <form th:action="${usuario.id == null} ? @{/usuarios} : @{/usuarios/{id}(id=${usuario.id})}" th:object="${usuario}" method="post">
            <div class="row">
              <div class="col-md-6 mb-3">
                <label for="nombre" class="form-label">Nombre *</label>
                <input type="text" class="form-control" id="nombre" th:field="*{nombre}">
              </div>
              <div class="col-md-6 mb-3">
                <label for="apellido" class="form-label">Apellido *</label>
                <input type="text" class="form-control" id="apellido" th:field="*{apellido}">
              </div>
            </div>
            <div class="row">
              <div class="col-md-6 mb-3">
                <label for="mail" class="form-label">Correo electrónico *</label>
                <input type="email" class="form-control" id="mail" th:field="*{mail}">
              </div>
              <div class="col-md-6 mb-3">
                <label for="rol" class="form-label">Rol *</label>
                <select class="form-select" id="rol" th:field="*{rol}">
                  <option value="VENDEDOR">Vendedor</option>
                  <option value="ADMINISTRADOR">Administrador</option>
                </select>
              </div>
            </div>
            <div class="row">
              <div class="col-md-6 mb-3">
                <label for="clave" class="form-label" th:text="${usuario.id == null ? 'Clave *' : 'Nueva clave (opcional)'}">Clave</label>
                <input type="password" class="form-control" id="clave" th:field="*{clave}" minlength="6">
              </div>
              <div class="col-md-6 mb-3">
                <label for="claveRepetida" class="form-label">Repetir clave</label>
                <input type="password" class="form-control" id="claveRepetida" th:field="*{claveRepetida}" minlength="6">
              </div>
            </div>
            <div class="d-flex gap-2">
              <button type="submit" class="btn btn-primary">Guardar</button>
              <a th:href="@{/usuarios}" class="btn btn-secondary">Cancelar</a>
            </div>
          </form>
        </div>
      </div>

      <div th:replace="~{fragments/layout :: pie}"></div>
    </div>
  </main>

  <th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>

</html>
