<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('Categoría')}"></head>

<body>
  <th:block th:replace="~{fragments/layout :: navegacion}"></th:block>

  <main id="content" class="content py-10">
    <div class="container-fluid">
      <div class="row">
        <div class="col-12">
          <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center mb-4 gap-3">
            <div>
              <h1 class="fs-3 mb-1" th:text="${categoria.id == null ? 'Nueva categoría' : 'Editar categoría'}"></h1>
              <p class="mb-0">Completá los datos de la categoría</p>
            </div>
            <div>
              <a th:href="@{/categorias}" class="btn btn-primary">Volver al listado</a>
            </div>
          </div>
        </div>
      </div>

      <div th:replace="~{fragments/layout :: alertas}"></div>

      <div class="card">
        <div class="card-body p-4">
          <form th:action="${categoria.id == null} ? @{/categorias} : @{/categorias/{id}(id=${categoria.id})}" th:object="${categoria}" method="post">
            <div class="mb-3">
              <label for="nombre" class="form-label">Nombre *</label>
              <input type="text" class="form-control" id="nombre" th:field="*{nombre}" placeholder="Ej: Periféricos">
            </div>
            <div class="d-flex gap-2">
              <button type="submit" class="btn btn-primary">Guardar</button>
              <a th:href="@{/categorias}" class="btn btn-secondary">Cancelar</a>
            </div>
          </form>
        </div>
      </div>

      <div th:replace="~{fragments/layout :: pie}"></div>
    </div>
  </main>

  <th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>

</html>
