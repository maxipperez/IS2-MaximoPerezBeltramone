<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('Categorías')}"></head>

<body>
  <th:block th:replace="~{fragments/layout :: navegacion}"></th:block>

  <main id="content" class="content py-10">
    <div class="container-fluid">
      <div class="row">
        <div class="col-12">
          <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
              <h1 class="fs-3 mb-1">Categorías</h1>
              <p class="mb-0">Organizá el catálogo agrupando productos</p>
            </div>
            <div>
              <a th:href="@{/categorias/nuevo}" class="btn btn-primary"><i class="ti ti-plus"></i> Nueva categoría</a>
            </div>
          </div>
        </div>
      </div>

      <div th:replace="~{fragments/layout :: alertas}"></div>

      <div class="card table-responsive">
        <table class="table mb-0 text-nowrap table-hover">
          <thead class="table-light border-light">
            <tr>
              <th>Nombre</th>
              <th>Productos asociados</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody>
            <tr class="align-middle" th:each="c : ${categorias}">
              <td class="fw-semibold" th:text="${c.nombre}"></td>
              <td th:text="${c.cantidadProductos}"></td>
              <td>
                <a th:href="@{/categorias/{id}/editar(id=${c.id})}" title="Editar"><i class="ti ti-edit"></i></a>
                <form class="d-inline" th:action="@{/categorias/{id}/eliminar(id=${c.id})}" method="post"
                  onsubmit="return confirm('¿Eliminar la categoría? Sus productos quedarán sin categoría.');">
                  <button class="btn btn-link link-danger p-0 ms-2" title="Eliminar"><i class="ti ti-trash"></i></button>
                </form>
              </td>
            </tr>
            <tr th:if="${#lists.isEmpty(categorias)}">
              <td colspan="3" class="text-center text-secondary py-4">No hay categorías cargadas</td>
            </tr>
          </tbody>
        </table>
      </div>

      <div th:replace="~{fragments/layout :: pie}"></div>
    </div>
  </main>

  <th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>

</html>
