<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('Detalle de orden')}"></head>

<body>
  <th:block th:replace="~{fragments/layout :: navegacion}"></th:block>

  <main id="content" class="content py-10">
    <div class="container-fluid">
      <div class="row">
        <div class="col-12">
          <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center mb-4 gap-3">
            <div>
              <h1 class="fs-3 mb-1" th:text="|Orden ${orden.codigo}|"></h1>
              <p class="mb-0" th:text="|${orden.proveedorRazonSocial} · ${#temporals.format(orden.fecha, 'dd/MM/yyyy')}|"></p>
            </div>
            <div class="d-flex gap-2">
              <th:block th:if="${orden.pendiente}">
                <form th:action="@{/ordenes/{id}/confirmar(id=${orden.id})}" method="post"
                  onsubmit="return confirm('Al confirmar se registra la factura del proveedor y se incrementa el stock. ¿Continuar?');">
                  <button class="btn btn-success"><i class="ti ti-check"></i> Confirmar recepción</button>
                </form>
                <a th:href="@{/ordenes/{id}/editar(id=${orden.id})}" class="btn btn-outline-primary"><i class="ti ti-edit"></i> Editar</a>
                <form th:action="@{/ordenes/{id}/cancelar(id=${orden.id})}" method="post"
                  onsubmit="return confirm('¿Cancelar la orden de compra?');">
                  <button class="btn btn-outline-danger"><i class="ti ti-trash"></i> Cancelar</button>
                </form>
              </th:block>
              <a th:href="@{/ordenes}" class="btn btn-primary">Volver</a>
            </div>
          </div>
        </div>
      </div>

      <div th:replace="~{fragments/layout :: alertas}"></div>

      <div class="row g-4 mb-4">
        <div class="col-md-4">
          <div class="card card-body">
            <small class="text-secondary">Estado</small>
            <span class="fs-5 fw-semibold" th:text="${orden.estado}"></span>
          </div>
        </div>
        <div class="col-md-4">
          <div class="card card-body">
            <small class="text-secondary">Total</small>
            <span class="fs-5 fw-semibold" th:text="${'$' + #numbers.formatDecimal(orden.total, 1, 'POINT', 2, 'COMMA')}"></span>
          </div>
        </div>
        <div class="col-md-4">
          <div class="card card-body">
            <small class="text-secondary">Factura del proveedor</small>
            <span class="fs-5 fw-semibold" th:text="${orden.nroFacturaProveedor != null ? 'N° ' + orden.nroFacturaProveedor : 'Pendiente de recepción'}"></span>
          </div>
        </div>
      </div>

      <div class="card table-responsive">
        <table class="table mb-0 text-nowrap">
          <thead class="table-light border-light">
            <tr>
              <th>Producto</th>
              <th>Cantidad</th>
              <th>Precio unitario</th>
              <th>Subtotal</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="d : ${orden.items}">
              <td th:text="${d.productoNombre}"></td>
              <td th:text="${d.cantidad}"></td>
              <td th:text="${'$' + #numbers.formatDecimal(d.precioUnitario, 1, 'POINT', 2, 'COMMA')}"></td>
              <td th:text="${'$' + #numbers.formatDecimal(d.subtotal, 1, 'POINT', 2, 'COMMA')}"></td>
            </tr>
          </tbody>
          <tfoot>
            <tr>
              <td colspan="3" class="text-end fw-semibold border-bottom-0">Total</td>
              <td class="fw-semibold border-bottom-0" th:text="${'$' + #numbers.formatDecimal(orden.total, 1, 'POINT', 2, 'COMMA')}"></td>
            </tr>
          </tfoot>
        </table>
      </div>

      <div th:replace="~{fragments/layout :: pie}"></div>
    </div>
  </main>

  <th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>

</html>
