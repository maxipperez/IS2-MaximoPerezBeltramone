<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('Orden de Compra')}"></head>

<body>
  <th:block th:replace="~{fragments/layout :: navegacion}"></th:block>

  <main id="content" class="content py-10">
    <div class="container-fluid">
      <div class="row">
        <div class="col-12">
          <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center mb-4 gap-3">
            <div>
              <h1 class="fs-3 mb-1" th:text="${orden.id == null ? 'Nueva orden de compra' : 'Editar orden ' + orden.codigo}"></h1>
              <p class="mb-0">Seleccioná el proveedor e indicá cantidad y precio de los productos a comprar</p>
            </div>
            <div>
              <a th:href="@{/ordenes}" class="btn btn-primary">Volver al listado</a>
            </div>
          </div>
        </div>
      </div>

      <div th:replace="~{fragments/layout :: alertas}"></div>

      <form th:action="${orden.id == null} ? @{/ordenes} : @{/ordenes/{id}(id=${orden.id})}" th:object="${orden}" method="post">
        <div class="card mb-4">
          <div class="card-body p-4">
            <label for="proveedorId" class="form-label">Proveedor *</label>
            <select class="form-select" id="proveedorId" th:field="*{proveedorId}" style="max-width: 420px;">
              <option value="">Seleccioná un proveedor</option>
              <option th:each="p : ${proveedores}" th:value="${p.id}" th:text="|${p.razonSocial} (${p.cuit})|"></option>
            </select>
          </div>
        </div>

        <div class="card table-responsive mb-4">
          <table class="table mb-0 text-nowrap table-hover">
            <thead class="table-light border-light">
              <tr>
                <th>Producto</th>
                <th>Stock actual</th>
                <th style="width: 160px;">Cantidad</th>
                <th style="width: 200px;">Precio unitario</th>
              </tr>
            </thead>
            <tbody>
              <tr class="align-middle" th:each="item, it : *{items}">
                <td>
                  <input type="hidden" th:field="*{items[__${it.index}__].productoId}">
                  <span th:text="${item.productoNombre}"></span>
                </td>
                <td th:text="${item.stockDisponible}"></td>
                <td><input type="number" min="0" class="form-control form-control-sm" th:field="*{items[__${it.index}__].cantidad}" placeholder="0"></td>
                <td><input type="number" min="0" step="0.01" class="form-control form-control-sm" th:field="*{items[__${it.index}__].precioUnitario}"></td>
              </tr>
              <tr th:if="${#lists.isEmpty(orden.items)}">
                <td colspan="4" class="text-center text-secondary py-4">No hay productos activos para comprar</td>
              </tr>
            </tbody>
          </table>
        </div>

        <div class="d-flex gap-2">
          <button type="submit" class="btn btn-primary">Guardar orden</button>
          <a th:href="@{/ordenes}" class="btn btn-secondary">Cancelar</a>
        </div>
      </form>

      <div th:replace="~{fragments/layout :: pie}"></div>
    </div>
  </main>

  <th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>

</html>
