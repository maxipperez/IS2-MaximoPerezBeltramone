<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('Producto')}"></head>

<body>
  <th:block th:replace="~{fragments/layout :: navegacion}"></th:block>

  <main id="content" class="content py-10">
    <div class="container-fluid">
      <div class="row">
        <div class="col-12">
          <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center mb-4 gap-3">
            <div>
              <h1 class="fs-3 mb-1" th:text="${producto.id == null ? 'Nuevo producto' : 'Editar producto'}"></h1>
              <p class="mb-0">Completá los datos del producto</p>
            </div>
            <div>
              <a th:href="@{/productos}" class="btn btn-primary">Volver al listado</a>
            </div>
          </div>
        </div>
      </div>

      <div th:replace="~{fragments/layout :: alertas}"></div>

      <div class="row">
        <div class="col-12">
          <div class="card">
            <div class="card-body p-4">
              <form th:action="${producto.id == null} ? @{/productos} : @{/productos/{id}(id=${producto.id})}" th:object="${producto}" method="post">
                <div class="row">
                  <div class="col-md-6 mb-3">
                    <label for="nombre" class="form-label">Nombre *</label>
                    <input type="text" class="form-control" id="nombre" th:field="*{nombre}" placeholder="Ej: Teclado mecánico">
                  </div>
                  <div class="col-md-6 mb-3">
                    <label for="precioUnitario" class="form-label">Precio de venta *</label>
                    <input type="number" class="form-control" id="precioUnitario" th:field="*{precioUnitario}" placeholder="0.00" step="0.01" min="0">
                  </div>
                </div>
                <div class="row">
                  <div class="col-md-6 mb-3">
                    <label for="categoriaId" class="form-label">Categoría</label>
                    <select class="form-select" id="categoriaId" th:field="*{categoriaId}">
                      <option value="">Sin categoría</option>
                      <option th:each="c : ${categorias}" th:value="${c.id}" th:text="${c.nombre}"></option>
                    </select>
                  </div>
                  <div class="col-md-6 mb-3" th:if="${producto.id == null}">
                    <label for="stockMaximo" class="form-label">Stock máximo</label>
                    <input type="number" class="form-control" id="stockMaximo" th:field="*{stockMaximo}" min="0">
                    <div class="form-text">El producto se registra con stock inicial en cero.</div>
                  </div>
                </div>
                <div class="mb-3">
                  <label for="descripcion" class="form-label">Descripción</label>
                  <textarea class="form-control" id="descripcion" rows="4" th:field="*{descripcion}" placeholder="Descripción del producto"></textarea>
                </div>
                <div class="d-flex gap-2">
                  <button type="submit" class="btn btn-primary">Guardar</button>
                  <a th:href="@{/productos}" class="btn btn-secondary">Cancelar</a>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>

      <div th:replace="~{fragments/layout :: pie}"></div>
    </div>
  </main>

  <th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>

</html>
