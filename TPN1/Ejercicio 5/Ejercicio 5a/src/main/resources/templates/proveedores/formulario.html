<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('Proveedor')}"></head>

<body>
  <th:block th:replace="~{fragments/layout :: navegacion}"></th:block>

  <main id="content" class="content py-10">
    <div class="container-fluid">
      <div class="row">
        <div class="col-12">
          <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center mb-4 gap-3">
            <div>
              <h1 class="fs-3 mb-1" th:text="${proveedor.id == null ? 'Nuevo proveedor' : 'Editar proveedor'}"></h1>
              <p class="mb-0">Completá los datos del proveedor</p>
            </div>
            <div>
              <a th:href="@{/proveedores}" class="btn btn-primary">Volver al listado</a>
            </div>
          </div>
        </div>
      </div>

      <div th:replace="~{fragments/layout :: alertas}"></div>

      <div class="card">
        <div class="card-body p-4">
          <form th:action="${proveedor.id == null} ? @{/proveedores} : @{/proveedores/{id}(id=${proveedor.id})}" th:object="${proveedor}" method="post">
            <div class="row">
              <div class="col-md-6 mb-3">
                <label for="razonSocial" class="form-label">Razón social *</label>
                <input type="text" class="form-control" id="razonSocial" th:field="*{razonSocial}">
              </div>
              <div class="col-md-6 mb-3">
                <label for="cuit" class="form-label">CUIT *</label>
                <input type="text" class="form-control" id="cuit" th:field="*{cuit}" placeholder="30-12345678-9">
              </div>
            </div>
            <div class="row">
              <div class="col-md-6 mb-3">
                <label for="telefono" class="form-label">Teléfono</label>
                <input type="text" class="form-control" id="telefono" th:field="*{telefono}">
              </div>
              <div class="col-md-6 mb-3 d-flex align-items-end" th:if="${proveedor.id != null}">
                <div class="form-check">
                  <input class="form-check-input" type="checkbox" id="activo" th:field="*{activo}">
                  <label class="form-check-label" for="activo">Activo</label>
                </div>
              </div>
            </div>
            <div class="d-flex gap-2">
              <button type="submit" class="btn btn-primary">Guardar</button>
              <a th:href="@{/proveedores}" class="btn btn-secondary">Cancelar</a>
            </div>
          </form>
        </div>
      </div>

      <div th:replace="~{fragments/layout :: pie}"></div>
    </div>
  </main>

  <th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>

</html>
