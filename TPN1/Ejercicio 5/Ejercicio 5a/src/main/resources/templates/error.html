<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('Error')}"></head>

<body>
  <div class="container d-flex align-items-center justify-content-center min-vh-100">
    <div class="" style="max-width: 500px; width: 100%;">
      <div class="text-center">
        <div class="mb-4">
          <a th:href="@{/}" class="d-inline-flex align-items-center mb-4">
            <img th:src="@{/assets/images/logo-icon.svg}" alt="" width="36">
            <span class="ms-2 fs-4 fw-semibold">TechSales</span>
          </a>
        </div>

        <h1 class="display-1 fw-bold text-primary mb-2" th:text="${status != null ? status : 'Ups'}">Ups</h1>
        <h2 class="card-title h4 mb-3" th:text="${mensaje != null ? 'No se pudo completar la operación' : 'Página no encontrada'}">Página no encontrada</h2>
        <p class="text-muted mb-4" th:text="${mensaje != null ? mensaje : 'La página que buscás no existe o fue movida.'}"></p>

        <a th:href="@{/}" class="btn btn-primary">Volver al catálogo</a>
      </div>
    </div>
  </div>
</body>

</html>
