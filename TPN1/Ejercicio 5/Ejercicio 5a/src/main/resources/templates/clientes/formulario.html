<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('Cliente')}"></head>

<body>
  <th:block th:replace="~{fragments/layout :: navegacion}"></th:block>

  <main id="content" class="content py-10">
    <div class="container-fluid">
      <div class="row">
        <div class="col-12">
          <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center mb-4 gap-3">
            <div>
              <h1 class="fs-3 mb-1" th:text="${cliente.id == null ? 'Nuevo cliente' : 'Editar cliente'}"></h1>
              <p class="mb-0">Completá los datos del cliente</p>
            </div>
            <div>
              <a th:href="@{/clientes}" class="btn btn-primary">Volver al listado</a>
            </div>
          </div>
        </div>
      </div>

      <div th:replace="~{fragments/layout :: alertas}"></div>

      <div class="card">
        <div class="card-body p-4">
          <form th:action="${cliente.id == null} ? @{/clientes} : @{/clientes/{id}(id=${cliente.id})}" th:object="${cliente}" method="post">
            <div class="row">
              <div class="col-md-6 mb-3">
                <label for="nombre" class="form-label">Nombre *</label>
                <input type="text" class="form-control" id="nombre" th:field="*{nombre}">
              </div>
              <div class="col-md-6 mb-3">
                <label for="apellido" class="form-label">Apellido *</label>
                <input type="text" class="form-control" id="apellido" th:field="*{apellido}">
              </div>
            </div>
            <div class="row">
              <div class="col-md-6 mb-3">
                <label for="dni" class="form-label">DNI *</label>
                <input type="text" class="form-control" id="dni" th:field="*{dni}" placeholder="Sin puntos">
              </div>
              <div class="col-md-6 mb-3">
                <label for="telefono" class="form-label">Teléfono</label>
                <input type="text" class="form-control" id="telefono" th:field="*{telefono}">
              </div>
            </div>
            <div class="d-flex gap-2">
              <button type="submit" class="btn btn-primary">Guardar</button>
              <a th:href="@{/clientes}" class="btn btn-secondary">Cancelar</a>
            </div>
          </form>
        </div>
      </div>

      <div th:replace="~{fragments/layout :: pie}"></div>
    </div>
  </main>

  <th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>

</html>
