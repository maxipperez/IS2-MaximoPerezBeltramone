<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('Registro')}"></head>

<body>
  <div class="container d-flex align-items-center justify-content-center min-vh-100">
    <div class="card " style="max-width:480px; width:100%;">
      <div class="card-body p-5">
        <div class="text-center mb-3">
          <span class="mb-4 d-inline-flex align-items-center"><img th:src="@{/assets/images/logo-icon.svg}" alt="" width="36">
            <span class="ms-2 fs-4 fw-semibold">TechSales</span>
          </span>
          <h1 class="card-title mb-5 h5">Crear una cuenta de vendedor</h1>
        </div>

        <div th:replace="~{fragments/layout :: alertas}"></div>

        <form class="mt-3" th:action="@{/registro}" th:object="${usuario}" method="post">
          <div class="row">
            <div class="col-md-6 mb-3">
              <label for="nombre" class="form-label">Nombre</label>
              <input id="nombre" type="text" class="form-control" th:field="*{nombre}" required>
            </div>
            <div class="col-md-6 mb-3">
              <label for="apellido" class="form-label">Apellido</label>
              <input id="apellido" type="text" class="form-control" th:field="*{apellido}" required>
            </div>
          </div>

          <div class="mb-3">
            <label for="mail" class="form-label">Correo electrónico (usuario)</label>
            <input id="mail" type="email" class="form-control" placeholder="nombre@ejemplo.com" th:field="*{mail}" required>
          </div>

          <div class="mb-3">
            <label for="clave" class="form-label">Clave</label>
            <input id="clave" type="password" class="form-control" placeholder="Mínimo 6 caracteres" th:field="*{clave}" required minlength="6">
          </div>

          <div class="mb-3">
            <label for="claveRepetida" class="form-label">Repetir clave</label>
            <input id="claveRepetida" type="password" class="form-control" th:field="*{claveRepetida}" required minlength="6">
          </div>

          <button class="btn btn-primary w-100" type="submit">Registrarme</button>
        </form>

        <div class="text-center mt-3 small text-muted">
          ¿Ya tenés cuenta? <a th:href="@{/login}" class="link-primary">Ingresá</a>
        </div>
      </div>
    </div>
  </div>

  <th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>

</html>
