<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('Alumno')}"></head>

<body>
  <div th:replace="~{fragments/layout :: sidebar('alumnos')}"></div>

  <div class="main-wrapper">
    <header th:replace="~{fragments/layout :: navbar}"></header>
    <div th:replace="~{fragments/layout :: encabezado(${alumno.id == null ? 'Nuevo alumno' : 'Editar alumno'}, 'Completá los datos del alumno')}"></div>
    <th:block th:replace="~{fragments/layout :: alertas}"></th:block>

    <div class="card border-light shadow-sm p-4">
      <form th:action="@{/alumnos}" th:object="${alumno}" method="post">
        <input type="hidden" th:field="*{id}">
        <div class="row">
          <div class="col-md-6 mb-3">
            <label for="nombre" class="form-label-custom">Nombre</label>
            <input type="text" id="nombre" class="form-control-custom" th:field="*{nombre}" required>
          </div>
          <div class="col-md-6 mb-3">
            <label for="apellido" class="form-label-custom">Apellido</label>
            <input type="text" id="apellido" class="form-control-custom" th:field="*{apellido}" required>
          </div>
          <div class="col-md-6 mb-3">
            <label for="dni" class="form-label-custom">DNI</label>
            <input type="text" id="dni" class="form-control-custom" th:field="*{dni}" required>
          </div>
          <div class="col-md-6 mb-3">
            <label for="aulaId" class="form-label-custom">Grado y aula</label>
            <select id="aulaId" class="form-select-custom" th:field="*{aulaId}" required>
              <option value="">Seleccioná un aula</option>
              <option th:each="a : ${aulas}" th:value="${a.id}" th:text="|${a.grado} - ${a.nombre}|"></option>
            </select>
          </div>
        </div>
        <div class="d-flex gap-2">
          <button type="submit" class="btn-custom btn-custom-primary">Guardar</button>
          <a th:href="@{/alumnos}" class="btn-custom btn-custom-light">Cancelar</a>
        </div>
      </form>
    </div>

    <footer th:replace="~{fragments/layout :: footer}"></footer>
  </div>

  <th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>

</html>
