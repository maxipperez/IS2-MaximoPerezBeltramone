<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('Nota')}"></head>

<body>
  <div th:replace="~{fragments/layout :: sidebar('notas')}"></div>

  <div class="main-wrapper">
    <header th:replace="~{fragments/layout :: navbar}"></header>
    <div th:replace="~{fragments/layout :: encabezado(${nota.id == null ? 'Nueva nota' : 'Editar nota'}, 'Registrá la nota de un alumno en una materia')}"></div>
    <th:block th:replace="~{fragments/layout :: alertas}"></th:block>

    <div class="card border-light shadow-sm p-4">
      <form th:action="@{/notas}" th:object="${nota}" method="post">
        <input type="hidden" th:field="*{id}">
        <div class="row">
          <div class="col-md-6 mb-3">
            <label for="alumnoId" class="form-label-custom">Alumno</label>
            <select id="alumnoId" class="form-select-custom" th:field="*{alumnoId}" required>
              <option value="">Seleccioná un alumno</option>
              <option th:each="a : ${alumnos}" th:value="${a.id}" th:text="|${a.apellido}, ${a.nombre} (${a.aula})|"></option>
            </select>
          </div>
          <div class="col-md-6 mb-3">
            <label for="materiaId" class="form-label-custom">Materia</label>
            <select id="materiaId" class="form-select-custom" th:field="*{materiaId}" required>
              <option value="">Seleccioná una materia</option>
              <option th:each="m : ${materias}" th:value="${m.id}" th:text="|${m.nombre} (${m.aula})|"></option>
            </select>
          </div>
          <div class="col-md-6 mb-3">
            <label for="valor" class="form-label-custom">Nota (1 a 10)</label>
            <input type="number" id="valor" class="form-control-custom" th:field="*{valor}" min="1" max="10" step="0.5" required>
          </div>
          <div class="col-md-6 mb-3">
            <label for="fecha" class="form-label-custom">Fecha</label>
            <input type="date" id="fecha" class="form-control-custom" th:field="*{fecha}">
          </div>
        </div>
        <div class="d-flex gap-2">
          <button type="submit" class="btn-custom btn-custom-primary">Guardar</button>
          <a th:href="@{/notas}" class="btn-custom btn-custom-light">Cancelar</a>
        </div>
      </form>
    </div>

    <footer th:replace="~{fragments/layout :: footer}"></footer>
  </div>

  <th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>

</html>
