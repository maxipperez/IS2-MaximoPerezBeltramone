# MySQL de XAMPP. La opción createDatabaseIfNotExist crea ejercicio4 en el primer arranque.
spring.datasource.url=jdbc:mysql://localhost:3306/ejercicio4?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=America/Argentina/Buenos_Aires
# XAMPP usa habitualmente root sin contraseña. Si configuraste una, reemplazá el valor vacío.
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.thymeleaf.cache=false
