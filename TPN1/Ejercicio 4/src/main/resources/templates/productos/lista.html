<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Productos</title>
    <!-- Bootstrap 5 proporciona una tabla y botones adaptables a cualquier pantalla. -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      body { background: #f5f7fb; }
      .navbar { background: #23395d; }
      .card { border: 0; border-radius: 1rem; }
      .badge-soft { background: #e0ecff; color: #1d4ed8; }
    </style>
  </head>
  <body>
    <!-- Barra propia del módulo Productos: no contiene accesos a otros módulos. -->
    <nav class="navbar navbar-dark shadow-sm">
      <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/productos}">Gestión Comercial</a>
      </div>
    </nav>

    <main class="container py-5">
      <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center mb-4">
        <div>
          <h1 class="h2 mb-1">Productos</h1>
          <p class="text-secondary mb-0">Catálogo activo y control de stock</p>
        </div>
        <a th:href="@{/productos/nuevo}" class="btn btn-primary mt-3 mt-md-0">
          + Nuevo producto
        </a>
      </div>

      <div class="card shadow-sm">
        <div class="card-body p-0">
          <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
              <thead class="table-light">
                <tr>
                  <th class="ps-4">Nombre</th>
                  <th>Precio</th>
                  <th>Stock</th>
                  <th class="text-end pe-4">Acciones</th>
                </tr>
              </thead>
              <tbody>
                <!-- th:each genera una fila por cada producto recibido desde el controlador. -->
                <tr th:each="producto : ${productos}">
                  <td class="ps-4 fw-semibold" th:text="${producto.nombre}"></td>
                  <td th:text="|$ ${producto.precio}|"></td>
                  <td>
                    <span class="badge badge-soft" th:text="${producto.stock}"></span>
                  </td>
                  <td class="text-end pe-4">
                    <a class="btn btn-sm btn-outline-primary" th:href="@{/productos/{id}/editar(id=${producto.id})}">
                      Editar
                    </a>
                    <!-- Este POST solicita la baja lógica; el servicio no borra la fila físicamente. -->
                    <form class="d-inline" th:action="@{/productos/{id}/eliminar(id=${producto.id})}" method="post">
                      <button class="btn btn-sm btn-outline-danger" onclick="return confirm('¿Dar de baja este producto?')">
                        Eliminar
                      </button>
                    </form>
                  </td>
                </tr>
                <tr th:if="${#lists.isEmpty(productos)}">
                  <td colspan="4" class="py-5 text-center text-secondary">
                    No hay productos activos.
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
