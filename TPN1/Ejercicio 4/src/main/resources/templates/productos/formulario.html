<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Producto</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><style>body{background:#f5f7fb}.navbar{background:#23395d}.card{border:0;border-radius:1rem}</style></head><body><nav class="navbar navbar-dark"><div class="container"><a class="navbar-brand fw-bold" th:href="@{/productos}">Gestión Comercial</a></div></nav><main class="container py-5"><div class="row justify-content-center"><div class="col-lg-7"><div class="card shadow-sm"><div class="card-body p-4 p-md-5"><h1 class="h3 mb-4" th:text="${producto.id == null ? 'Nuevo producto' : 'Editar producto'}"></h1><!-- th:if muestra el ErrorService capturado por el controlador. --><div th:if="${error}" class="alert alert-danger" th:text="${error}"></div><!-- th:object vincula los campos HTML al objeto Producto. --><form th:action="${producto.id == null} ? @{/productos} : @{/productos/{id}(id=${producto.id})}" th:object="${producto}" method="post"><div class="mb-3"><label class="form-label">Nombre</label><input class="form-control" th:field="*{nombre}" required></div><div class="row"><div class="col-md-6 mb-3"><label class="form-label">Precio</label><input type="number" min="0" step="0.01" class="form-control" th:field="*{precio}" required></div><div class="col-md-6 mb-4"><label class="form-label">Stock</label><input type="number" min="0" class="form-control" th:field="*{stock}" required></div></div><div class="d-flex gap-2"><button class="btn btn-primary">Guardar</button><a th:href="@{/productos}" class="btn btn-light">Cancelar</a></div></form></div></div></div></div></main></body></html>
