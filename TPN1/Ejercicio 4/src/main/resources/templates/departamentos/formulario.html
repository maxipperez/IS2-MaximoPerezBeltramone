<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Departamento</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><style>body{background:#f5f7fb}.card{border:0;border-radius:1rem}</style></head><body><main class="container py-5"><div class="row justify-content-center"><div class="col-md-7"><div class="card shadow-sm"><div class="card-body p-5"><h1 class="h3 mb-4">Departamento</h1><!-- Alerta presentada ante ErrorService. --><div th:if="${error}" class="alert alert-danger" th:text="${error}"></div><form th:action="${departamento.id == null} ? @{/departamentos} : @{/departamentos/{id}(id=${departamento.id})}" th:object="${departamento}" method="post"><div class="mb-3"><label class="form-label">Nombre</label><input class="form-control" th:field="*{nombre}" required></div><div class="mb-4"><label class="form-label">Ubicación</label><input class="form-control" th:field="*{ubicacion}" required></div><button class="btn btn-primary">Guardar</button><a th:href="@{/departamentos}" class="btn btn-light">Cancelar</a></form></div></div></div></div></main></body></html>
