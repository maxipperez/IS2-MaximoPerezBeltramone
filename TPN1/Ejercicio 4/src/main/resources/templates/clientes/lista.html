<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Clientes</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><style>body{background:#f5f7fb}.navbar{background:#23395d}.card{border:0;border-radius:1rem}</style></head><body><nav class="navbar navbar-dark"><div class="container"><a class="navbar-brand fw-bold" th:href="@{/productos}">Gestión Comercial</a></div></nav><main class="container py-5"><div class="d-flex justify-content-between align-items-center mb-4"><div><h1 class="h2 mb-1">Clientes</h1><p class="text-secondary mb-0">Usuarios compradores activos</p></div><a th:href="@{/clientes/nuevo}" class="btn btn-primary">+ Nuevo cliente</a></div><div class="card shadow-sm"><div class="table-responsive"><table class="table table-hover align-middle mb-0"><thead class="table-light"><tr><th class="ps-4">Nombre</th><th>Documento</th><th>Correo</th><th class="text-end pe-4">Acciones</th></tr></thead><tbody><!-- th:each renderiza cada cliente enviado desde ClienteController. --><tr th:each="cliente : ${clientes}"><td class="ps-4 fw-semibold" th:text="|${cliente.nombre} ${cliente.apellido}|"></td><td th:text="${cliente.documento}"></td><td th:text="${cliente.correoPersonal}"></td><td class="text-end pe-4"><a class="btn btn-sm btn-outline-primary" th:href="@{/clientes/{id}/editar(id=${cliente.id})}">Editar</a><form class="d-inline" th:action="@{/clientes/{id}/eliminar(id=${cliente.id})}" method="post"><button class="btn btn-sm btn-outline-danger">Eliminar</button></form></td></tr></tbody></table></div></div></main></body></html>
