<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administradores</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><style>body{background:#f5f7fb}.navbar{background:#23395d}.card{border:0;border-radius:1rem}</style></head><body><nav class="navbar navbar-dark"><div class="container"><a class="navbar-brand fw-bold" th:href="@{/productos}">Gestión Comercial</a></div></nav><main class="container py-5"><div class="d-flex justify-content-between align-items-center mb-4"><h1 class="h2">Administradores</h1><a th:href="@{/administradores/nuevo}" class="btn btn-primary">+ Nuevo</a></div><div class="card shadow-sm"><div class="table-responsive"><table class="table table-hover mb-0"><thead class="table-light"><tr><th class="ps-4">Nombre</th><th>Documento</th><th>Correo</th><th></th></tr></thead><tbody><!-- La tabla usa th:each para presentar el listado activo. --><tr th:each="administrador : ${administradores}"><td class="ps-4" th:text="|${administrador.nombre} ${administrador.apellido}|"></td><td th:text="${administrador.documento}"></td><td th:text="${administrador.correoPersonal}"></td><td><a class="btn btn-sm btn-outline-primary" th:href="@{/administradores/{id}/editar(id=${administrador.id})}">Editar</a><form class="d-inline" th:action="@{/administradores/{id}/eliminar(id=${administrador.id})}" method="post"><button class="btn btn-sm btn-outline-danger">Eliminar</button></form></td></tr></tbody></table></div></div></main></body></html>
