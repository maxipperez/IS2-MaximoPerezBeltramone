<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administrador</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><style>body{background:#f5f7fb}.card{border:0;border-radius:1rem}</style></head><body><main class="container py-5"><div class="row justify-content-center"><div class="col-lg-8"><div class="card shadow-sm"><div class="card-body p-5"><h1 class="h3 mb-4">Administrador</h1><!-- ErrorService se visualiza como alerta Bootstrap. --><div th:if="${error}" class="alert alert-danger" th:text="${error}"></div><form th:action="${administrador.id == null} ? @{/administradores} : @{/administradores/{id}(id=${administrador.id})}" th:object="${administrador}" method="post"><div class="row"><div class="col-md-6 mb-3"><label class="form-label">Nombre</label><input class="form-control" th:field="*{nombre}" required></div><div class="col-md-6 mb-3"><label class="form-label">Apellido</label><input class="form-control" th:field="*{apellido}" required></div><div class="col-md-6 mb-3"><label class="form-label">Documento</label><input type="number" class="form-control" th:field="*{documento}" required></div><div class="col-md-6 mb-3"><label class="form-label">Nacimiento</label><input type="date" class="form-control" th:field="*{fechaNacimiento}" required></div><div class="col-md-6 mb-3"><label class="form-label">Correo</label><input type="email" class="form-control" th:field="*{correoPersonal}" required></div><div class="col-md-6 mb-4"><label class="form-label">Contraseña</label><input type="password" class="form-control" th:field="*{password}" required></div></div><button class="btn btn-primary">Guardar</button><a th:href="@{/administradores}" class="btn btn-light">Cancelar</a></form></div></div></div></div></main></body></html>
