<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Producto | MVC</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body { background-color: #f4f6f9; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .form-card { max-width: 550px; margin: auto; border-radius: 12px; border: none; box-shadow: 0 5px 15px rgba(0,0,0,0.08); }
    </style>
</head>
<body>
    <div class="container mt-5 pt-4">
        <div class="card form-card p-4 p-md-5">
            
            <h3 class="mb-4 text-center fw-bold text-dark">Modificar Producto</h3>

            <!-- Bloque para mostrar el mensaje de ErrorService en caso de validación fallida -->
            <div th:if="${error != null}" class="alert alert-danger d-flex align-items-center" role="alert">
                <i class="bi bi-exclamation-triangle-fill flex-shrink-0 me-3 fs-4"></i>
                <div th:text="${error}"></div>
            </div>

            <!-- 
                th:object="${producto}": 
                TÉCNICA AVANZADA DE THYMELEAF (Form binding).
                Le dice a la plantilla que este formulario interactúa exclusivamente con el objeto "producto" 
                que enviamos desde el Controlador (el producto buscado en la base de datos).
            -->
            <form th:action="@{/productos/actualizar}" method="POST" th:object="${producto}">
                
                <!-- 
                    Campo oculto (hidden) para enviar el ID. 
                    th:field="*{id}": El asterisco (*) es el operador de selección. 
                    Actúa sobre el objeto definido en th:object. Es equivalente a escribir ${producto.id}.
                    Al usar th:field, Thymeleaf automáticamente nos rellena los atributos HTML name="id", id="id" y value="UUID_DEL_PRODUCTO".
                -->
                <input type="hidden" th:field="*{id}">
                
                <div class="mb-3">
                    <label class="form-label text-muted fw-bold">Nombre del Producto</label>
                    <!-- th:field se encarga de rellenar el input con el nombre que el producto ya tenía en la BD -->
                    <input type="text" class="form-control form-control-lg bg-light" th:field="*{nombre}">
                </div>
                
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label text-muted fw-bold">Precio Unitario ($)</label>
                        <input type="number" step="0.01" class="form-control form-control-lg bg-light" th:field="*{precio}">
                    </div>
                    
                    <div class="col-md-6 mb-4">
                        <label class="form-label text-muted fw-bold">Stock</label>
                        <input type="number" class="form-control form-control-lg bg-light" th:field="*{stock}">
                    </div>
                </div>

                <div class="d-grid gap-3 d-md-flex justify-content-md-end mt-4">
                    <a th:href="@{/productos/listar}" class="btn btn-light px-4 py-2 fw-bold text-secondary">Cancelar</a>
                    <button type="submit" class="btn btn-warning px-5 py-2 fw-bold shadow-sm text-dark">
                        <i class="bi bi-arrow-repeat me-2"></i> Actualizar
                    </button>
                </div>
            </form>

        </div>
    </div>
</body>
</html>
