<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar Producto | MVC</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body { background-color: #f4f6f9; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .form-card { max-width: 550px; margin: auto; border-radius: 12px; border: none; box-shadow: 0 5px 15px rgba(0,0,0,0.08); }
    </style>
</head>
<body>
    <div class="container mt-5 pt-4">
        <div class="card form-card p-4 p-md-5">
            
            <h3 class="mb-4 text-center fw-bold text-dark">Nuevo Producto</h3>

            <!-- 
                MANEJO DE EXCEPCIONES (ErrorService)
                th:if="${error != null}": Verifica si el Controlador inyectó en el modelo una variable llamada "error".
                Esto ocurre únicamente cuando el servicio lanzó la excepción ErrorService y el Controlador la capturó.
                Si la variable error no es null, se dibuja este contenedor div de alerta.
            -->
            <div th:if="${error != null}" class="alert alert-danger d-flex align-items-center" role="alert">
                <i class="bi bi-exclamation-triangle-fill flex-shrink-0 me-3 fs-4"></i>
                
                <!-- th:text="${error}": Aquí se imprime dinámicamente el mensaje de nuestro ErrorService. -->
                <div th:text="${error}">
                    Mensaje de error genérico (Será reemplazado por Thymeleaf)
                </div>
            </div>

            <!-- 
                th:action: Le indica al formulario hacia qué ruta enviar los datos.
                th:action="@{/productos/guardar}" llamará a la URL que mapeamos con @PostMapping en el Controlador.
            -->
            <form th:action="@{/productos/guardar}" method="POST">
                
                <div class="mb-3">
                    <label class="form-label text-muted fw-bold">Nombre del Producto</label>
                    <!-- 
                        Al no usar th:object (técnica vista en el formulario de edición), usamos "name".
                        Este atributo 'name' es clave: Spring usará @RequestParam String nombre para atraparlo.
                    -->
                    <input type="text" class="form-control form-control-lg bg-light" name="nombre" placeholder="Ej. Zapatillas deportivas">
                </div>
                
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label text-muted fw-bold">Precio Unitario ($)</label>
                        <input type="number" step="0.01" class="form-control form-control-lg bg-light" name="precio" placeholder="0.00" value="0.00">
                    </div>
                    
                    <div class="col-md-6 mb-4">
                        <label class="form-label text-muted fw-bold">Stock Inicial</label>
                        <input type="number" class="form-control form-control-lg bg-light" name="stock" value="0">
                    </div>
                </div>

                <div class="d-grid gap-3 d-md-flex justify-content-md-end mt-4">
                    <a th:href="@{/productos/listar}" class="btn btn-light px-4 py-2 fw-bold text-secondary">Cancelar</a>
                    <button type="submit" class="btn btn-primary px-5 py-2 fw-bold shadow-sm">
                        <i class="bi bi-save me-2"></i> Guardar Registro
                    </button>
                </div>
            </form>

        </div>
    </div>
</body>
</html>
