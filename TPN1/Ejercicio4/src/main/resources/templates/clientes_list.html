<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Directorio de Clientes | MVC</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body { background-color: #f4f6f9; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .card { border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); border: none; }
        .table th { background-color: #198754; color: white; border-top-left-radius: 8px; border-top-right-radius: 8px; }
    </style>
</head>
<body>
    <div class="container mt-5">
        
        <!-- Botón para volver al Home -->
        <a th:href="@{/}" class="btn btn-outline-secondary mb-3 rounded-pill fw-bold">
            <i class="bi bi-arrow-left me-2"></i> Menú Principal
        </a>
        
        <div class="card p-4">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2 class="m-0 text-dark fw-bold"><i class="bi bi-people-fill me-2 text-success"></i>Directorio de Clientes</h2>
                
                <a th:href="@{/clientes/crear}" class="btn btn-success rounded-pill px-4 shadow-sm">
                    <i class="bi bi-person-plus-fill me-1"></i> Registrar Cliente
                </a>
            </div>

            <div class="table-responsive">
                <table class="table table-hover align-middle shadow-sm">
                    <thead>
                        <tr>
                            <th>Doc.</th>
                            <th>Nombre Completo</th>
                            <th>Correo Electrónico</th>
                            <th>Estado</th>
                            <th class="text-center">Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Bucle por cada cliente en la base de datos -->
                        <tr th:each="c : ${clientes}">
                            <td class="text-muted fw-bold" th:text="${c.documento}"></td>
                            
                            <!-- Concatenación en Thymeleaf -->
                            <td class="fw-semibold" th:text="${c.nombre} + ' ' + ${c.apellido}"></td>
                            
                            <td th:text="${c.correoPersonal}"></td>
                            
                            <td>
                                <!-- Color dinámico según estado -->
                                <span class="badge" th:classappend="${c.estado.name() == 'ACTIVO'} ? 'bg-success' : 'bg-warning text-dark'" 
                                      th:text="${c.estado}">ACTIVO</span>
                            </td>
                            
                            <td class="text-center">
                                <a th:href="@{/clientes/modificar/__${c.id}__}" class="btn btn-sm btn-outline-dark me-2">
                                    <i class="bi bi-pencil-square"></i> Editar
                                </a>
                                <a th:href="@{/clientes/eliminar/__${c.id}__}" class="btn btn-sm btn-outline-danger" 
                                   onclick="return confirm('¿Dar de baja temporalmente a este cliente?');">
                                    <i class="bi bi-person-x-fill"></i> Baja
                                </a>
                            </td>
                        </tr>
                        
                        <tr th:if="${clientes.empty}">
                            <td colspan="5" class="text-center text-muted py-5">
                                <i class="bi bi-person-slash fs-1 d-block mb-2"></i>
                                No hay clientes activos registrados.
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
