<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alta de Cliente | MVC</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body { background-color: #f4f6f9; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .form-card { max-width: 600px; margin: auto; border-radius: 12px; border: none; box-shadow: 0 5px 15px rgba(0,0,0,0.08); }
    </style>
</head>
<body>
    <div class="container mt-5 pt-4">
        <div class="card form-card p-4 p-md-5 border-top border-success border-5">
            <h3 class="mb-4 text-center fw-bold text-dark">Formulario de Registro</h3>

            <div th:if="${error != null}" class="alert alert-danger d-flex align-items-center" role="alert">
                <i class="bi bi-exclamation-triangle-fill flex-shrink-0 me-3 fs-4"></i>
                <div th:text="${error}"></div>
            </div>

            <!-- POST hacia ClienteController -->
            <form th:action="@{/clientes/guardar}" method="POST">
                
                <div class="mb-3">
                    <label class="form-label text-muted fw-bold">Documento / DNI</label>
                    <input type="number" class="form-control form-control-lg bg-light" name="documento" required>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label text-muted fw-bold">Nombre</label>
                        <input type="text" class="form-control form-control-lg bg-light" name="nombre" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label text-muted fw-bold">Apellido</label>
                        <input type="text" class="form-control form-control-lg bg-light" name="apellido" required>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label text-muted fw-bold">Correo Electrónico Personal</label>
                    <input type="email" class="form-control form-control-lg bg-light" name="correo" required>
                </div>

                <div class="mb-4">
                    <label class="form-label text-muted fw-bold">Contraseña de acceso</label>
                    <input type="password" class="form-control form-control-lg bg-light" name="password" required>
                </div>

                <div class="d-grid gap-3 d-md-flex justify-content-md-end mt-4">
                    <a th:href="@{/clientes/listar}" class="btn btn-light px-4 py-2 fw-bold text-secondary">Cancelar</a>
                    <button type="submit" class="btn btn-success px-5 py-2 fw-bold shadow-sm">
                        <i class="bi bi-person-check-fill me-2"></i> Dar de Alta
                    </button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
