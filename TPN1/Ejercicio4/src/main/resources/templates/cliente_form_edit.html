<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modificar Cliente | MVC</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body { background-color: #f4f6f9; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .form-card { max-width: 600px; margin: auto; border-radius: 12px; border: none; box-shadow: 0 5px 15px rgba(0,0,0,0.08); }
    </style>
</head>
<body>
    <div class="container mt-5 pt-4">
        <div class="card form-card p-4 p-md-5 border-top border-warning border-5">
            <h3 class="mb-4 text-center fw-bold text-dark">Modificar Datos del Cliente</h3>

            <div th:if="${error != null}" class="alert alert-danger d-flex align-items-center" role="alert">
                <i class="bi bi-exclamation-triangle-fill flex-shrink-0 me-3 fs-4"></i>
                <div th:text="${error}"></div>
            </div>

            <!-- Uso del patrón Data Binding th:object -->
            <form th:action="@{/clientes/actualizar}" method="POST" th:object="${cliente}">
                <input type="hidden" th:field="*{id}">
                
                <div class="mb-3">
                    <label class="form-label text-muted fw-bold">Documento</label>
                    <input type="number" class="form-control form-control-lg bg-light text-muted" th:field="*{documento}" readonly>
                    <small class="text-danger d-block mt-1"><i class="bi bi-lock-fill"></i> El documento legal no se puede modificar.</small>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label text-muted fw-bold">Nombre</label>
                        <input type="text" class="form-control form-control-lg bg-light" th:field="*{nombre}" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label text-muted fw-bold">Apellido</label>
                        <input type="text" class="form-control form-control-lg bg-light" th:field="*{apellido}" required>
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label text-muted fw-bold">Correo Personal</label>
                    <input type="email" class="form-control form-control-lg bg-light text-muted" th:field="*{correoPersonal}" readonly>
                    <small class="text-danger d-block mt-1"><i class="bi bi-lock-fill"></i> El correo está vinculado a la cuenta.</small>
                </div>

                <div class="d-grid gap-3 d-md-flex justify-content-md-end mt-4">
                    <a th:href="@{/clientes/listar}" class="btn btn-light px-4 py-2 fw-bold text-secondary">Cancelar</a>
                    <button type="submit" class="btn btn-warning px-5 py-2 fw-bold shadow-sm text-dark">
                        <i class="bi bi-save2 me-2"></i> Actualizar Ficha
                    </button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
